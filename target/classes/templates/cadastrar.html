<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css
" integrity="sha384-
xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N"
          crossorigin="anonymous" >
    <title>Cadastrar Produto</title>
</head>
<body>
<div class="container mt-5">
    <h1 class="mb-4">Cadastrar Produto</h1>
    <!--
    th:action → define o endpoint do formulário como POST /cadastrar
    th:object → vincula o formulário ao objeto Produto do model
    method → envia os dados via POST
    -->
    <form th:action="@{/cadastrar}" th:object="${produto}" method="post">
        <div class="form-group">
            <label for="nome">Nome</label>
            <!-- th:field gera id, name e value automaticamente a partir do
           atributo do objeto -->
            <input class="form-control" type="text" th:field="*{nome}"
                   placeholder="Ex: Camiseta, Notebook..." required />
        </div>
        <div class="form-group">
            <label for="preco">Preço (R$)</label>
            <input class="form-control" type="number" th:field="*{preco}"
                   step="0.01" min="0" placeholder="Ex: 49.90" required />
        </div>

        <div class="form-group">
            <label for="categoria">Categoria</label>
            <select id="categoria" class="form-control" th:field="*{categoria}">
                <option value="">Selecione uma categoria</option>
                <option value="vestuario">Vestuário</option>
                <option value="eletronico">Eletrônico</option>
                <option value="alimento">Alimento</option>
                <option value="outro">Outro</option>
            </select>
        </div>

        <div class="form-group">
            <label for="estoque">Estoque</label>
            <input class="form-control" type="number" th:field="*{estoque}"
                   step="0.01" min="0" placeholder="Ex: 100 200 300" required />
        </div>
        <div class="form-group">
            <label for="descricao">Descriçao</label>
            <input class="form-control" type="text" th:field="*{descricao}"
                   placeholder="Material, cor...." required />
        </div>
        <button class="btn btn-primary" type="submit">Cadastrar</button>
    </form>
    <a href="/lista" class="btn btn-secondary mt-3">Ver lista de produtos</a>
</div>
</body>
</html>
